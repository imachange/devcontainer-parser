run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true

output:
  formats:
    - format: colored-line-number

linters-settings:
  govet:
    enable-all: true
    disable:
      - fieldalignment
  gofumpt:
    extra-rules: true
  revive:
    severity: warning
    confidence: 0.8
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveHeader

linters:
  disable-all: true
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gofumpt
    - gosimple
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0